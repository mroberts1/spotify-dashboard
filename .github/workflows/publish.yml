on:
  workflow_dispatch:
  push:
    branches: main
  schedule:
    # Daily at 13:00 UTC. Rendering hits kworb.net + the Spotify /v1/tracks
    # endpoint every run, so each render = latest Top 50.
    - cron: '0 13 * * *'

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # r-lib/actions/setup-r@v2 still ships as a Node 20 action, and
      # r-lib/actions/setup-renv@v2 transitively invokes actions/cache@v4
      # (also Node 20). GitHub will force these to Node 24 from June 2026 and
      # remove Node 20 from the runner in September 2026. Opt in now so we
      # stop getting the deprecation annotation and verify they keep working.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          # Pinned to match renv.lock. Ubuntu ships pre-built binaries for
          # this version via posit RSPM so installs stay fast.
          r-version: '4.2.0'

      - name: Install system dependencies
        # System libraries required by the R packages in renv.lock:
        #   libxml2-dev   -> xml2 (used by rvest to parse kworb HTML)
        #   libv8-dev     -> V8  (transitive via juicyjuice -> gt)
        #   harfbuzz/fribidi/freetype -> textshaping / systemfonts (via gt)
        #   libcurl/openssl           -> curl / httr2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev \
            libv8-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          # Bump cache-version whenever renv.lock changes so the cached
          # library is rebuilt.
          cache-version: 2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Spotify Web API credentials. Add these as repository secrets at:
          #   https://github.com/<owner>/<repo>/settings/secrets/actions
          # using the exact names SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
